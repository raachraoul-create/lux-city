name: Build mobile apps
on:
  workflow_dispatch:
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm install
      - run: npm run mobile:build
      - run: npx cap add android
      - run: npx cap sync android
      - run: node scripts/configure-native.mjs
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: lux-city-android
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/bundle/release/*.aab
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install
      - run: npm run mobile:build
      - run: npx cap add ios
      - run: npx cap sync ios
      - run: node scripts/configure-native.mjs
      - run: xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Release -sdk iphoneos CODE_SIGNING_ALLOWED=NO -archivePath "$PWD/LuxCity.xcarchive" archive
      - uses: actions/upload-artifact@v4
        with:
          name: lux-city-ios-unsigned
          path: LuxCity.xcarchive
